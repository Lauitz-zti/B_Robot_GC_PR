<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Gemelo Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body { 
            background-color: #0b0f19; 
            overflow-x: hidden;
        }
        /* Estilo para el contenedor del Robot 3D */
        #contenedor3D {
            width: 100%;
            height: 700px;
            background-color: #151b2b;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="text-white p-4">
    
    <div class="position-absolute top-0 end-0 p-4 z-3">
        <a href="perfil.html" class="btn btn-outline-light rounded-circle p-2" title="Mi Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
            </svg>
        </a>
        <button id="btnCerrarSesion" class="btn btn-danger ms-2 rounded-circle p-2" title="Cerrar Sesión">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M8.5 10c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/><path d="M10.828.122A.5.5 0 0 1 11 .5V1h.5A1.5 1.5 0 0 1 13 2.5V15h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V1.5a.5.5 0 0 1 .43-.495l7-1a.5.5 0 0 1 .398.117M11.5 2H11v13h1V2.5a.5.5 0 0 0-.5-.5M4 1.934V15h6V1.077z"/></svg>
        </button>
    </div>

    <div class="container-fluid">
        <div class="d-flex justify-content-start align-items-center mb-4">
            <h2 class="fw-bold m-0 me-3">Gemelo Digital en Tiempo Real</h2>
            <span id="badgeConexion" class="badge bg-danger fs-6 py-2 px-3 rounded-pill shadow-sm">
                Desconectado
            </span>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="bg-dark p-4 rounded-4 shadow border border-secondary mb-3">
                    <h5 class="text-secondary border-bottom pb-2 mb-3">Cinematica Directa UR3e</h5>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Base (Base)</span> <span id="valBase" class="fw-bold text-primary">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoBase" min="-360" max="360" step="0.01" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Hombro (Shoulder)</span> <span id="valShoulder" class="fw-bold text-primary">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoShoulder" min="-180" max="0" step="0.01" value="-90">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Codo (Elbow)</span> <span id="valElbow" class="fw-bold text-primary">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoElbow" min="-150" max="150" step="0.01" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Muñeca</span> <span id="valWrist1" class="fw-bold text-info">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoWrist1" min="-360" max="360" step="0.01" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Muñeca 2</span> <span id="valWrist2" class="fw-bold text-info">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoWrist2" min="-360" max="360" step="0.01" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between">
                            <span>Pinza</span> <span id="valWrist3" class="fw-bold text-info">0.00°</span>
                        </label>
                        <input type="range" class="form-range" id="rangoWrist3" min="-360" max="360" step="0.01" value="0">
                    </div>
                    
                    <div class="mt-4 text-center">
                        <button id="btnEnviarPosicion" class="btn btn-primary w-100 py-2 fw-bold text-white shadow">GUARDAR POSICIÓN ACTUAL</button>
                    </div>
                </div>
                <div class="bg-dark p-4 rounded-4 shadow border border-warning mt-3">
                <h5 class="text-warning border-bottom pb-2 mb-3">Estudio de Grabación</h5>
                
                <div class="d-flex justify-content-between mb-3">
                    <button id="btnCapturarFrame" class="btn btn-outline-warning w-100 me-2">+ Capturar Paso</button>
                    <span id="contadorFrames" class="badge bg-secondary d-flex align-items-center px-3">0 Pasos</span>
                </div>
                
                <div class="input-group mb-3">
                    <input type="text" id="txtNombreRutina" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Rutina de Agarre">
                    <button id="btnGuardarRutina" class="btn btn-warning fw-bold">GUARDAR</button>
                </div>

                <hr class="border-secondary">

                <label class="form-label text-light">Reproducir Rutina Guardada:</label>
                <div class="input-group">
                    <select id="selectRutinas" class="form-select bg-dark text-white border-secondary">
                        <option value="">Selecciona una rutina...</option>
                    </select>
                    <button id="btnPlayRutina" class="btn btn-success fw-bold">PLAY</button>
                </div>
            </div>
            </div>

            <div class="col-md-8">
                <div id="contenedor3D"></div>
            </div>
        </div>
    </div>

    <script src="robot3D.js"></script>
    <script src="logger.js"></script> 
    <script src="conexion.js"></script> 
    <script src="grabacion.js"></script>
</body>
</html>
