<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Gemelo Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; }
    </style>
</head>
<body class="text-white p-5">
    
    <div class="position-absolute top-0 end-0 p-4">
        <a href="perfil.html" class="btn btn-outline-light rounded-circle p-2" title="Mi Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
            </svg>
        </a>
        <button id="btnCerrarSesion" class="btn btn-danger ms-2 rounded-circle p-2" title="Cerrar Sesión">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8.5 10c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"/>
                <path d="M10.828.122A.5.5 0 0 1 11 .5V1h.5A1.5 1.5 0 0 1 13 2.5V15h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3V1.5a.5.5 0 0 1 .43-.495l7-1a.5.5 0 0 1 .398.117M11.5 2H11v13h1V2.5a.5.5 0 0 0-.5-.5M4 1.934V15h6V1.077z"/>
            </svg>
        </button>
    </div>

    <div class="container">
        <h2 class="mb-4 text-center fw-bold">Consola de Telemetría</h2>
        
        <div class="row mt-4 bg-dark p-4 rounded-4 shadow border border-secondary">
            <div class="col-md-6 mb-3">
                <h5 class="text-secondary border-bottom pb-2 mb-3">Ejes Principales</h5>
                
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Base (Y)</span> <span id="valBase" class="fw-bold text-primary">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoBase" min="-180" max="180" value="0">
                </div>
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Hombro (X)</span> <span id="valHombro" class="fw-bold text-primary">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoHombro" min="-180" max="180" value="0">
                </div>
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Codo (X)</span> <span id="valCodo" class="fw-bold text-primary">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoCodo" min="-180" max="180" value="0">
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <h5 class="text-secondary border-bottom pb-2 mb-3">Efector Final</h5>
                
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Muñeca Pitch (X)</span> <span id="valPitch" class="fw-bold text-info">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoPitch" min="-180" max="180" value="0">
                </div>
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Muñeca Roll (Z)</span> <span id="valRoll" class="fw-bold text-info">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoRoll" min="-180" max="180" value="0">
                </div>
                <div class="mb-3">
                    <label class="form-label d-flex justify-content-between">
                        <span>Efector Yaw (Y)</span> <span id="valYaw" class="fw-bold text-info">0°</span>
                    </label>
                    <input type="range" class="form-range" id="rangoYaw" min="-180" max="180" value="0">
                </div>
            </div>
            
            <div class="col-12 mt-3 text-center">
                <button id="btnEnviarPosicion" class="btn btn-primary px-5 py-2 fw-bold text-white shadow">TRANSMITIR COORDENADAS</button>
            </div>
        </div>
    </div>

    <script>
        const controles = ['Base', 'Hombro', 'Codo', 'Pitch', 'Roll', 'Yaw'];
        
        //Seguridad inicial
        const idDinamico = localStorage.getItem("brazoActivo");
        if(!idDinamico) {
            alert("No hay conexion activa. Regresando a seguridad...");
            window.location.replace("inicioSesion.html");
        }

        //Sincronizamos el estado inicial de los sliders con la base de datos al cargar la pagina
        document.addEventListener('DOMContentLoaded', () => {
            fetch(`http://localhost:8080/api/brazo/estado/${idDinamico}`)
            .then(res => res.json())
            .then(datos => {
                if(datos.status === "success" && datos.angulos) {
                    // Actualizamos cada slider con los datos de la base de datos
                    document.getElementById('rangoBase').value = datos.angulos.base;
                    document.getElementById('valBase').innerText = `${datos.angulos.base}°`;
                    
                    document.getElementById('rangoHombro').value = datos.angulos.hombro;
                    document.getElementById('valHombro').innerText = `${datos.angulos.hombro}°`;
                    
                    document.getElementById('rangoCodo').value = datos.angulos.codo;
                    document.getElementById('valCodo').innerText = `${datos.angulos.codo}°`;
                    
                    document.getElementById('rangoPitch').value = datos.angulos.pitch;
                    document.getElementById('valPitch').innerText = `${datos.angulos.pitch}°`;
                    
                    document.getElementById('rangoRoll').value = datos.angulos.roll;
                    document.getElementById('valRoll').innerText = `${datos.angulos.roll}°`;
                    
                    document.getElementById('rangoYaw').value = datos.angulos.yaw;
                    document.getElementById('valYaw').innerText = `${datos.angulos.yaw}°`;
                }
            })
            .catch(err => console.log("Estado inicial no disponible aún."));
        });

        //Actuaizacion en tiempo real de los valores al mover los sliders
        controles.forEach(eje => {
            const slider = document.getElementById(`rango${eje}`);
            const texto = document.getElementById(`val${eje}`);
            
            slider.addEventListener('input', (event) => {
                texto.innerText = `${event.target.value}°`;
            });
        });

        //Enviar los datos al servidor al hacer click en el boton
        const btnEnviar = document.getElementById('btnEnviarPosicion');
        btnEnviar.addEventListener('click', () => {
            
            const textoOriginal = btnEnviar.innerText;
            btnEnviar.innerText = "Transmitiendo...";
            btnEnviar.disabled = true;

            const payload = {
                id_brazo: parseInt(idDinamico), 
                angulos: {
                    base: parseInt(document.getElementById('rangoBase').value),
                    hombro: parseInt(document.getElementById('rangoHombro').value),
                    codo: parseInt(document.getElementById('rangoCodo').value),
                    pitch: parseInt(document.getElementById('rangoPitch').value),
                    roll: parseInt(document.getElementById('rangoRoll').value),
                    yaw: parseInt(document.getElementById('rangoYaw').value)
                }
            };

            fetch('http://localhost:8080/api/brazo/actualizar', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                if(datos.status === "success") {
                    console.log("Éxito:", datos.mensaje);
                } else {
                    alert("Fallo lógico: " + datos.mensaje);
                }
            })
            .catch(err => alert("No se pudo conectar con el servidor."))
            .finally(() => {
                btnEnviar.innerText = textoOriginal;
                btnEnviar.disabled = false;
            });
        });

        //Cerrar sesion
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            localStorage.removeItem("brazoActivo");
            window.location.replace("inicioSesion.html");
        });
    </script>
</body>
</html>
