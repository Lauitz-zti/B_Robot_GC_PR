<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazor - Inicio de Sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0f19; 
            height: 100vh;
        }
        .login-card {
            background: #151b2b;
            border: 1px solid #334155;
            border-radius: 16px;
        }
        .btn-google {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #dee2e6;
            transition: all 0.2s;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 col-xl-4">
                
                <div class="card login-card shadow-lg">
                    <div class="card-body p-5">
                        
                        <div class="text-center mb-4">
                            <i class="bi bi-robot text-primary" style="font-size: 3rem;"></i>
                            <h3 class="fw-bold mt-2 mb-1">Control de Brazo</h3>
                            <p class="text-secondary small">Ingresa tus credenciales para acceder</p>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="email" id="txtEmail" class="form-control" placeholder="nombre@institucional.edu">
                            <label for="txtEmail"><i class="bi bi-envelope me-2"></i>Correo electronico</label>
                        </div>
                        
                        <div class="form-floating mb-4">
                            <input type="password" id="txtPassword" class="form-control" placeholder="Contraseña">
                            <label for="txtPassword"><i class="bi bi-lock me-2"></i>Contraseña</label>
                        </div>
                        
                        <div class="d-grid gap-2 mb-3">
                            <button id="btnIngresar" class="btn btn-primary py-2 fw-bold">
                                Iniciar Sesion
                            </button>
                            <a href="registro.html" class="btn btn-outline-secondary py-2 fw-bold">
                                Crear una cuenta
                            </a>
                        </div>

                        <div class="d-flex align-items-center my-4">
                            <hr class="flex-grow-1 border-secondary">
                            <span class="mx-3 text-secondary small text-uppercase">o continuar con</span>
                            <hr class="flex-grow-1 border-secondary">
                        </div>
                        
                        <button id="btnLoginGoogle" class="btn btn-google w-100 py-2 fw-bold d-flex align-items-center justify-content-center">
                            <i class="bi bi-google text-danger me-2"></i> Acceder con Google
                        </button>
                        
                        <div id="resultado" class="alert d-none mt-4 text-center small" role="alert"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        //Configuracion firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBZw2-mhQmHGDXMrFHLqfmJmNtSEKgU2Zs",
            authDomain: "brazorobot-web.firebaseapp.com",
            projectId: "brazorobot-web",
            storageBucket: "brazorobot-web.firebasestorage.app",
            messagingSenderId: "691940249414",
            appId: "1:691940249414:web:cfb2800893af7788085f47"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const btnLoginGoogle = document.getElementById('btnLoginGoogle');
        const btnIngresar = document.getElementById('btnIngresar');
        const txtEmail = document.getElementById('txtEmail');
        const txtPassword = document.getElementById('txtPassword');
        const divResultado = document.getElementById('resultado');

        function enviarTokenAlBackend(idToken) {
            divResultado.className = "alert alert-warning mt-3 text-center small";
            divResultado.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Autenticando con el servidor...`;
            divResultado.classList.remove('d-none');
            
            const baseUrl = window.location.origin;
            fetch(`${baseUrl}/api/auth/verificar-token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: idToken})
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                if(datos.status === "success") {
                    localStorage.setItem("brazoActivo", datos.id_brazo);
                    localStorage.setItem("firebaseToken", idToken);
                    
                    divResultado.className = "alert alert-success mt-3 text-center small";
                    divResultado.innerHTML = `<i class="bi bi-check-circle me-1"></i> ${datos.mensaje}. Redirigiendo...`;
                    
                    setTimeout(() => {
                        if (datos.rol === 'ADMIN') {
                            window.location.href = 'Admin.html';
                        } else {
                            window.location.href = 'panel.html';
                        }
                    }, 1500); 
                    
                } else {
                    divResultado.className = "alert alert-danger mt-3 text-center small";
                    divResultado.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i> ${datos.mensaje}`;
                }
            })
            .catch(error => {
                divResultado.className = "alert alert-danger mt-3 text-center small";
                divResultado.innerHTML = `<i class="bi bi-wifi-off me-1"></i> Error de red al conectar con el servidor.`;
                console.error(error);
            });
        }

        btnLoginGoogle.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(result => result.user.getIdToken())
                .then(idToken => enviarTokenAlBackend(idToken))
                .catch(error => console.error("Error con Google:", error));
        });

        btnIngresar.addEventListener('click', () => {
            const email = txtEmail.value;
            const password = txtPassword.value;

            if(!email || !password) {
                alert("Por favor, ingresa tu correo y contraseña.");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(userCredential => userCredential.user.getIdToken())
                .then(idToken => enviarTokenAlBackend(idToken))
                .catch(error => {
                    divResultado.className = "alert alert-danger mt-3 text-center small";
                    divResultado.classList.remove('d-none');
                    divResultado.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i> Credenciales incorrectas o usuario no encontrado.`;
                });
        });
    </script>
</body>
</html>
