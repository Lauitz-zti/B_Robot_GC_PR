<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazo Robotico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card bg-secondary text-white text-center shadow-lg" style="width: 25rem;">
        <div class="card-body p-5">
            <h3 class="card-title mb-4">Control de Brazo Robotico</h3>
            
            <input type="email" id="txtEmail" class="form-control mb-3" placeholder="Correo institucional">
            <input type="password" id="txtPassword" class="form-control mb-4" placeholder="Contraseña">
            
            <div class="d-flex justify-content-between mb-3">
                <button id="btnIngresar" class="btn btn-success w-100 me-2 fw-bold">Ingresar</button>
                <a href="registro.html" class="btn btn-outline-light w-100 ms-2 fw-bold">Registrarse</a>
            </div>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 border-light">
                <span class="mx-2 text-light">o</span>
                <hr class="flex-grow-1 border-light">
            </div>
            
            <button id="btnLoginGoogle" class="btn btn-primary w-100 mb-3 fw-bold">
                Acceder con Google
            </button>
            
            <div id="resultado" class="alert d-none mt-3" role="alert"></div>
        </div>
    </div>

    <script type="module">
        // Importamos las nuevas funciones de correo y contraseña
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        //Configuracion de Firebase
        const firebaseConfig = {
        apiKey: "AIzaSyBZw2-mhQmHGDXMrFHLqfmJmNtSEKgU2Zs",
        authDomain: "brazorobot-web.firebaseapp.com",
        projectId: "brazorobot-web",
        storageBucket: "brazorobot-web.firebasestorage.app",
        messagingSenderId: "691940249414",
        appId: "1:691940249414:web:cfb2800893af7788085f47"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Referencias a los elementos de la interfaz
        const btnLoginGoogle = document.getElementById('btnLoginGoogle');
        const btnIngresar = document.getElementById('btnIngresar');
        const btnRegistrar = document.getElementById('btnRegistrar');
        const txtEmail = document.getElementById('txtEmail');
        const txtPassword = document.getElementById('txtPassword');
        const divResultado = document.getElementById('resultado');

        //Envia el token de Firebase al backend para su validacion y creacion de sesion
        function enviarTokenAlBackend(idToken) {
            divResultado.className = "alert alert-warning mt-3";
            divResultado.innerHTML = "Autenticando con el servidor...";
            divResultado.classList.remove('d-none');
            
            fetch('http://localhost:8080/api/auth/verificar-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: idToken })
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                            if(datos.status === "success") {
                                localStorage.setItem("brazoActivo", datos.id_brazo);
                                divResultado.className = "alert alert-success mt-3";
                                divResultado.innerHTML = `Conexin establecida: ${datos.mensaje}. Redirigiendo al laboratorio...`;
                                
                                setTimeout(() => {
                                    window.location.href = 'panel.html';
                                }, 1500); // 1500 milisegundos = 1.5 segundos de espera
                                
                            } else {
                                divResultado.className = "alert alert-danger mt-3";
                                divResultado.innerHTML = `Fallo en el sistema: ${datos.mensaje}`;
                            }
                        })
            .catch(error => {
                divResultado.className = "alert alert-danger mt-3";
                divResultado.innerHTML = `Error de red al conectar con el servidor.`;
                console.error(error);
            });
        }

        //Acceso con Google
        btnLoginGoogle.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(result => result.user.getIdToken())
                .then(idToken => enviarTokenAlBackend(idToken))
                .catch(error => console.error("Error con Google:", error));
        });

        //Ingreso con correo y contraseña
        btnIngresar.addEventListener('click', () => {
            const email = txtEmail.value;
            const password = txtPassword.value;

            if(!email || !password) {
                alert("Por favor, ingresa tu correo y contraseña.");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(userCredential => userCredential.user.getIdToken())
                .then(idToken => enviarTokenAlBackend(idToken))
                .catch(error => {
                    divResultado.className = "alert alert-danger mt-3";
                    divResultado.classList.remove('d-none');
                    divResultado.innerHTML = `Credenciales incorrectas o usuario no encontrado.`;
                });
        });
    </script>
</body>
</html>
